services:
  - type: web
    name: cinematch-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
      - key: PARTNER_URL
        sync: false
      - key: TMDB_API_KEY
        value: 8265bd1679663a7ea12ac168da84d2e8
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
